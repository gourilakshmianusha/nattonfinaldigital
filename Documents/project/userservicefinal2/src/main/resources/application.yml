server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/users_db
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

debug: true
